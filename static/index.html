<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuoteLoop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <main class="max-w-4xl mx-auto p-6">
    <h1 class="text-2xl font-semibold">QuoteLoop</h1>
    <p class="text-slate-500 mb-6">Placeholder page. This is where the three-panel UI goes on Thursday.</p>

    <h2 class="font-medium mb-2">Invoices</h2>
    <table class="w-full text-sm bg-white rounded shadow">
      <thead class="text-left text-slate-500">
        <tr><th class="p-2">Number</th><th class="p-2">Customer</th><th class="p-2">Total</th><th class="p-2">Status</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    async function refresh() {
      try {
        const res = await fetch('/api/invoices');
        const data = await res.json();
        document.getElementById('rows').innerHTML = data.map(i =>
          `<tr class="border-t"><td class="p-2">${i.invoice_number}</td>
           <td class="p-2">${i.customer_name}</td>
           <td class="p-2">${i.currency} ${i.total.toFixed(2)}</td>
           <td class="p-2 font-medium">${i.status}</td></tr>`).join('');
      } catch (e) { /* server restarting */ }
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
